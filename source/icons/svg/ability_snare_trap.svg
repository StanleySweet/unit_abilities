<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2f3d5"/><stop offset="1" stop-color="#9cc3a0"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7ffc4"/><stop offset="1" stop-color="#f2ff9e"/></linearGradient>
<filter id="material" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
