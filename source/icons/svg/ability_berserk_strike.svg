<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4d3e"/><stop offset="1" stop-color="#23170a"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5e2c5"/><stop offset="1" stop-color="#c5af8d"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4a6"/><stop offset="1" stop-color="#ffd36b"/></linearGradient>
<filter id="material" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
  <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.55" specularExponent="16" lighting-color="#ffffff" result="spec">
    <feDistantLight azimuth="235" elevation="50"/>
  </feSpecularLighting>
  <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
  <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k2="1" k3="0.8" result="lit"/>
  <feMorphology in="SourceAlpha" operator="dilate" radius="1.3" result="thick"/>
  <feFlood flood-color="#0d0a06"/><feComposite in2="thick" operator="in" result="outline"/>
  <feGaussianBlur in="thick" stdDeviation="2"/><feOffset dx="1.2" dy="2.6"/>
  <feComponentTransfer result="shadow"><feFuncA type="linear" slope="0.65"/></feComponentTransfer>
  <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="lit"/></feMerge>
</filter>
<radialGradient id="ground" cx="0.5" cy="0.4" r="0.75"><stop offset="0" stop-color="#5e4128"/><stop offset="1" stop-color="#20160e"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8f96"/><stop offset="0.45" stop-color="#3b3f45"/><stop offset="1" stop-color="#16181b"/></linearGradient>
</defs>
<rect x="1" y="1" width="126" height="126" rx="14" fill="url(#rim)"/>
<rect x="3.5" y="3.5" width="121" height="121" rx="12" fill="none" stroke="#0b0c0e" stroke-width="1.5"/>
<rect x="8" y="8" width="112" height="112" rx="9" fill="url(#ground)" stroke="#0b0c0e" stroke-width="2"/>
<g filter="url(#material)"><g transform="translate(8.78 9.20) scale(0.8398)">
<path d="M30 104 L62 72" stroke="url(#body)" stroke-width="13" stroke-linecap="round"/>
<path d="M56 78 L48 70 L76 34 C82 28 90 30 96 36 C102 42 102 50 96 54 Z" fill="url(#face)"/>
<g fill="url(#body)"><path d="M78 30 L82 20 L88 32 Z"/><path d="M98 52 L108 48 L98 42 Z"/><path d="M64 46 L54 42 L66 40 Z"/><path d="M80 62 L84 72 L74 64 Z"/></g></g></g>
</svg>
