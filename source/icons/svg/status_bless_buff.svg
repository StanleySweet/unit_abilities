<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a17d3f"/><stop offset="1" stop-color="#60410b"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d67a"/><stop offset="1" stop-color="#c8a136"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffcec"/><stop offset="1" stop-color="#fffbe0"/></linearGradient>
<filter id="material" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="thick"/>
  <feFlood flood-color="#0a0806"/><feComposite in2="thick" operator="in" result="outline"/>
  <feGaussianBlur in="thick" stdDeviation="1.4"/><feOffset dx="0.8" dy="1.6"/>
  <feComponentTransfer result="shadow"><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
  <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g filter="url(#material)"><g transform="translate(8.60 8.71) scale(0.8639)">
<defs><path id="beam" d="M60 30 L64 6 L68 30 Z"/></defs>
<g fill="url(#accent)"><use href="#beam" transform="rotate(0 64 64)"/><use href="#beam" transform="rotate(30 64 64)"/><use href="#beam" transform="rotate(60 64 64)"/><use href="#beam" transform="rotate(90 64 64)"/><use href="#beam" transform="rotate(120 64 64)"/><use href="#beam" transform="rotate(150 64 64)"/><use href="#beam" transform="rotate(180 64 64)"/><use href="#beam" transform="rotate(210 64 64)"/><use href="#beam" transform="rotate(240 64 64)"/><use href="#beam" transform="rotate(270 64 64)"/><use href="#beam" transform="rotate(300 64 64)"/><use href="#beam" transform="rotate(330 64 64)"/></g>
<circle cx="64" cy="64" r="34" fill="none" stroke="url(#body)" stroke-width="16"/>
<circle cx="64" cy="64" r="34" fill="none" stroke="url(#face)" stroke-width="11"/></g></g>
</svg>
